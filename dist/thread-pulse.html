    return { nodes: [...routers, ...ends, ...sleepy], wifi, brExt: br.id, demo: { routers, sleepy, dec, rid },
             routers: { [br.id]: { vendor: "Home Assistant", model: "OpenThread Border Router", name: "Home Assistant OpenThread Border Router #BEEF", version: "1.4.0", network: "demo-thread" } },
             thread: { otbr: { extAddr: br.id, borderAgentId: "00000000000000000000000000demo00", channel: 15, extPanId: "dead00beef00cafe" },
                       datasets: [{ name: "demo-thread", channel: 15, panId: "1234", extPanId: "dead00beef00cafe", preferred: true, source: "otbr" }] } };
  }
  // demo: one invented change per refresh – a battery device moves to another parent, or a device drops out / comes back
  function demoMutate() {
    const m = demoState, { routers, sleepy, dec, rid } = m.demo;
    if (m.demo.apple) {                         // Apple demo: a battery device moves to another Apple router
      const s = sleepy[Math.floor(Math.random() * sleepy.length)], cur = s.neigh[0] && s.neigh[0]["0"];
      const others = m.demo.apple.filter(a => dec(a) !== cur);
      s.neigh = [{ "0": dec(others[Math.floor(Math.random() * others.length)]), "6": Math.round(-80 + Math.random() * 25) }];
      return m;
    }
    if (Math.random() < 0.6) {
      const s = sleepy.filter(x => x.available)[Math.floor(Math.random() * 5)] || sleepy[0];
      const oldP = routers.find(r => r.neigh.some(x => x["13"] && x["0"] === dec(s.id)));
      const newP = routers.filter(r => r !== oldP)[Math.floor(Math.random() * (routers.length - 1))];
      const rs = Math.round(-55 - Math.random() * 30);
      if (oldP) oldP.neigh = oldP.neigh.filter(x => x["0"] !== dec(s.id));
      newP.neigh.push({ "0": dec(s.id), "6": rs, "11": false, "13": true });
      s.neigh = [{ "0": dec(newP.id), "6": rs }]; s.routes = [{ "0": dec(newP.id), "2": rid[newP.id], "3": 0, "4": 0, "9": true }];
    } else {
      const n = m.nodes.filter(x => x !== sleepy[3])[Math.floor(Math.random() * (m.nodes.length - 1))];
      n.available = !n.available;
    }
    return m;
  }
  // Apple-only network (issue #71): Thread network from an iPhone, three Apple border routers (not Matter devices of HA),
  // only battery devices, no OpenThread add-on – the border router is unknown, messages go device → parent router only.
  function demoModelApple() {
    const de = lang === "de";
    let seq = 0x2000;
    const mk = (name, icon) => ({ id: "f2a0c0de0000" + (seq++).toString(16), name, icon, role: 2, type: "sleepy_end_device", available: true, neigh: [], routes: [] });
    const apple = ["e2b17114", "a90cd4ce", "5f31eb09"].map(x => "86d1aa10" + x);      // shown as …7114, …d4ce, …eb09
    const dec = id => BigInt("0x" + id).toString();
    const sleepy = [mk(de ? "Wetter Balkon" : "Balcony weather", "thermometer"), mk(de ? "Wetter Garten" : "Garden weather", "thermometer"),
                    mk(de ? "Haustür" : "Front door", "door"), mk(de ? "Fenster Küche" : "Kitchen window", "window-closed-variant")];
    sleepy.forEach((s, i) => {
      const p = apple[[0, 0, 1, 2][i]], rs = Math.round(-80 + Math.random() * 25);
      s.neigh = [{ "0": dec(p), "6": rs }]; s.routes = [];
      s.area = de ? ["Balkon", "Garten", "Flur", "Küche"][i] : ["Balcony", "Garden", "Hallway", "Kitchen"][i];
      s.info = { vendor: i < 2 ? "Eve Systems" : "Aqara", product: i < 2 ? "Eve Weather" : "Door and Window Sensor P2", sw: "3.2.1", hw: "1.1",
                 reboots: 1, bootReason: 1, detached: 1, attach: 1, parentChanges: i, batType: i < 2 ? "CR2450" : "CR123A", net: { name: "MyHome", channel: 25, panId: 4097, extPanId: "86d1a0b0c0d0e0f0" } };
      s.demoBattery = [91, 84, 100, 67][i]; s.demoIdentify = true;
      s.demoValues = s.icon === "thermometer" ? [[localName("Temperature"), "14.2 °C", 120], [localName("Humidity"), "71 %", 300]] : [[localName("Contact"), T.states.closed, 3600]];
    });
    const wifi = [{ id: "wifi:demo-air", kind: "wifi", name: de ? "Luftqualität" : "Air quality monitor", icon: "air-filter", available: true, area: de ? "Büro" : "Office",
      entities: [], mainEntities: [], demoValues: [["CO₂", "612 ppm", 180]], demoIdentify: true,
      info: { vendor: "Demo Inc.", product: "Air quality monitor", sw: "1.0.4", hw: "1.0", reboots: 3, bootReason: 1, rssi: -58, channel: 11, wifiVersion: 3 } }];
    const ar = name => ({ vendor: "Apple", model: "BorderRouter", name, version: "1.4.0", network: "MyHome", brand: "apple" });   // as Apple announces it
    return { nodes: sleepy, wifi, brExt: null, demo: { routers: [], sleepy, dec, rid: {}, apple },
             routers: { [apple[0]]: ar(de ? "HomePod Wohnzimmer" : "HomePod Living Room"), [apple[1]]: ar(de ? "AppleTV Wohnzimmer" : "AppleTV Living Room"),
                        [apple[2]]: ar(de ? "AppleTV Schlafzimmer" : "AppleTV Bedroom") },
             thread: { otbr: null, datasets: [{ name: "MyHome", channel: 25, panId: "1001", extPanId: "86d1a0b0c0d0e0f0", preferred: true, source: "iOS-app" }] } };
  }
  function demoTraffic(model) {
    const de = lang === "de";
    const msgs = n => n.icon === "power-plug" ? [localName("Power"), `${(Math.random() * 120).toFixed(1)} W`]
      : n.icon === "thermometer" || n.icon === "thermostat" ? [localName("Temperature"), `${(19 + Math.random() * 4).toFixed(1)} °C`]
      : n.icon === "window-closed-variant" || n.icon === "door" ? [localName("Contact"), Math.random() < 0.5 ? T.states.open : T.states.closed]
      : n.icon === "motion-sensor" ? [localName("Motion"), Math.random() < 0.5 ? T.states.on : T.states.off]
      : [T.state, Math.random() < 0.5 ? T.states.on : T.states.off];
    const live = model.nodes.filter(n => n.available);
    const step = () => {
      if (destroyed) return;
      const n = live[Math.floor(Math.random() * live.length)];
      if (Math.random() < 0.35 && ["lightbulb", "power-plug", "blinds"].includes(n.icon)) {
        launch(n.id, true, `HA → <b>${esc(n.name)}</b>: ${n.icon === "blinds" ? "cover.open_cover" : n.icon === "lightbulb" ? "light.toggle" : "switch.toggle"}`);
        const ms = n.icon === "blinds" ? 900 + Math.random() * 900 : 120 + Math.random() * 380;      // the demo blinds are slow
        setTimeout(() => { if (destroyed) return; recordResponse(n.id, ms); launch(n.id, false, `<b>${esc(n.name)}</b> → HA: ${T.state} ${T.states.on} · ${Math.round(ms)} ms`); }, ms);
      }
      else { const [what, val] = msgs(n); launch(n.id, false, `<b>${esc(n.name)}</b> → HA: ${what} ${val}`); }
      setTimeout(step, 600 + Math.random() * 1800);
    };
    setTimeout(step, 1500);
    every(showTicker, 10000);
  }

  // ---------- UI ----------
  let hintCount = 0;
  function setList(show, save = true) {
    $("info").classList.toggle("hidden", !show);
    setBtn($("toggle"), T.netBtn, show, hintCount, hintCount ? T.listHints(hintCount) : "");
    if (show) renderTabBar();              // opening the change log tab marks its entries as seen
    if (save) prefs.set("list", show);
    if (network && save) setTimeout(() => { network.redraw(); network.fit({ animation: { duration: 300 } }); }, 50);
  }
  function setLegend(show, save = true) {
    $("legend").classList.toggle("hidden", !show);
    const t = (show ? T.hideLegend : T.showLegend).replace(/^\S+\s/, "");       // the button shows "?", the text is its tooltip
    $("legbtn").title = t; $("legbtn").setAttribute("aria-label", t); $("legbtn").setAttribute("aria-expanded", String(show));
    if (save) prefs.set("legend", show);
  }
  function showErr(e) {
    setList(true, false);
    $("info").classList.add("errshown");
    $("status").textContent = T.error;
    $("info").innerHTML = `<div id="err">${esc(e.message || e)}</div>`;
  }
  let demoState = null;
  async function load() {
    setMoreMenu(false);
    $("status").textContent = T.loading;
    const prev = lastSnap;
    if (DEMO) {
      const m = demoState || (demoState = demoModel()); render(m); diffSnaps(prev, lastSnap); loadBatteryForecasts(null);
      setTimeout(() => { brInfo = m.routers || {}; applyRouterNames(); }, 2500);     // like the real discovery: names arrive later
      return m;
    }
    const m = await loadHa();
    await initChangeStore(m.hass);        // before the first comparison: the stored list comes from Home Assistant
    render(m);
    diffSnaps(prev, lastSnap);
    loadBatteryForecasts(m.hass);          // runs in the background, panel and badges update when it arrives
    await subscribeLive(m.hass);
    discoverRouters(m.hass);              // names of other border routers arrive in the background
    return m;
  }

  applyColorVars();
  theme();

  root.addEventListener("keydown", e => { if (e.key === "Escape" && !$("report").hidden) return closeReport(); if (e.key === "Escape" && !$("moremenu").hidden) { setMoreMenu(false); $("morebtn").focus(); return; } if (e.key === "Escape" && e.target.id !== "search") { if (markedIds && panelNode === null) clearMarks(); closePanel(); } });
  root.addEventListener("pointerdown", e => { if (!e.target.closest || !e.target.closest("#morebox")) setMoreMenu(false); });

  root.addEventListener("click", e => {
    const t = e.target.closest && e.target.closest("[data-open],[data-act],[data-device],[data-identify]"); if (!t) return;
    e.preventDefault();
    if (t.dataset.open) openPanel(t.dataset.open);
    else if (t.dataset.act === "close") closePanel();
    else if (t.dataset.act === "export" || t.dataset.act === "exportanon") exportImage(t.dataset.act === "exportanon");
    else if (t.dataset.act === "report") showReport();
    else if (t.dataset.act === "reportclose") closeReport();
    else if (t.dataset.act === "reportcopy") copyReport();
    else if (t.dataset.act === "clearchanges") clearChanges();
    else if (t.dataset.act === "unmark") clearMarks();
    else if (t.dataset.device) openDevice(t.dataset.device);
    else if (t.dataset.identify) pressIdentify(t.dataset.identify);
  });
  // ---------- ambient mode (issue #11) ----------
  // Only the mesh, dark. Every 25 s the view glides slowly to a router and back to the whole mesh (against burn-in).
  // Paused for 60 s after the screen was touched. Asks the browser to keep the screen on (needs HTTPS – fails silently otherwise).
  if (AMBIENT) {
    $("wrap").classList.add("ambient");
    let lastTouch = 0, step = 0;
    root.addEventListener("pointerdown", () => { lastTouch = Date.now(); }, true);
    if (AMBIENT_MOTION) every(() => {
      if (!network || roomTween || panelNode || Date.now() - lastTouch < 60000) return;
      const routers = Object.values(nodeById).filter(n => n.type === "routing_end_device");
      const ease = "easeInOutQuad";
      if (step++ % 2 === 0 && routers.length) {
        const n = routers[Math.floor(Math.random() * routers.length)];
        network.focus(n.id, { scale: Math.min(1.6, network.getScale() * 1.6), animation: { duration: 8000, easingFunction: ease } });
      } else network.fit({ animation: { duration: 8000, easingFunction: ease } });
    }, 25000);
    const wake = async () => { try { if (navigator.wakeLock && document.visibilityState === "visible") await navigator.wakeLock.request("screen"); } catch (e) {} };
    wake(); document.addEventListener("visibilitychange", wake);
  }
  let startList = false, startLegend = false;     // the legend is an overlay on the map (issue #107): closed until opened
  soundVolume = prefs.get("volume");
  $("volume").value = String(soundVolume);
  if (prefs.get("sound")) setSound(true, false);
  heatOn = prefs.get("heat"); roomOn = prefs.get("rooms");
  startList = prefs.get("list"); startLegend = prefs.get("legend", startLegend);
  $("info").classList.toggle("hidden", !startList);
  $("legend").classList.toggle("hidden", !startLegend);
  setLanguage(lang);
  $("reload").onclick = () => load().catch(showErr);
  $("status").onclick = () => { if (network) load().catch(showErr); };      // tap the status line to reload (issue #107)
  $("status").onkeydown = e => { if ((e.key === "Enter" || e.key === " ") && network) { e.preventDefault(); load().catch(showErr); } };
  $("toggle").onclick = () => setList($("info").classList.contains("hidden"));
  $("roombtn").onclick = () => {
    roomOn = !roomOn; setBtn($("roombtn"), roomOn ? T.roomsOff : T.roomsOn, roomOn);
    prefs.set("rooms", roomOn);
    applyRooms(roomOn);
  };
  $("soundbtn").onclick = () => setSound(!soundOn);
  $("volume").oninput = () => { soundVolume = Number($("volume").value); prefs.set("volume", soundVolume); playTick(false); };
  $("heatbtn").onclick = () => {
    heatOn = !heatOn; setBtn($("heatbtn"), heatOn ? T.heatOff : T.heatOn, heatOn);
    prefs.set("heat", heatOn);
    if (network) network.redraw();
  };
  $("morebtn").onclick = () => setMoreMenu($("moremenu").hidden);
  $("legbtn").onclick = () => setLegend($("legend").classList.contains("hidden"));
  $("livebtn").onclick = () => {
    liveOn = !liveOn; setBtn($("livebtn"), liveOn ? T.pause : T.resume, liveOn);
    if (!liveOn) packets = [];
  };
  load().then(m => { if (DEMO) demoTraffic(m); }).catch(showErr);

  return {
    destroy() {
      destroyed = true; timers.forEach(clearInterval);
      if (unsub) { try { unsub(); } catch (e) {} unsub = null; }
      if (brUnsub) { try { brUnsub(); } catch (e) {} brUnsub = null; }
      if (store && store.unsub) { try { store.unsub(); } catch (e) {} }
      clearTimeout(saveTimer);
      if (network) { network.destroy(); network = null; }
    },
    theme,
  };
}

// ---------- standalone page: runs in an iframe inside a Home Assistant dashboard ----------
(() => {
  const params = new URLSearchParams(location.search);
  const style = document.createElement("style");
  style.textContent = TP_CSS + `
  html, body { margin: 0; height: 100%; background: var(--bg); }`;
  document.head.appendChild(style);
  document.body.insertAdjacentHTML("afterbegin", TP_HTML);
  const haRoot = () => parent.document.querySelector("home-assistant");
  createThreadPulse(document, { demo: params.has("demo") && (params.get("demo") || true), lang: params.get("lang"), ambient: params.has("ambient"), showWifi: !params.has("nowifi"), ambientMotion: !params.has("still") }, {
    embedded: window.parent !== window,
    hass: () => haRoot().hass,
    themeSource: () => parent.document.documentElement,
    styleTarget: document.documentElement,
    navigate: path => {
      try { parent.history.pushState(null, "", path); parent.dispatchEvent(new CustomEvent("location-changed")); }
      catch (e) { window.open(path, "_top"); }
    },
    width: () => window.innerWidth,
    vis: window.vis,
  });
})();
</script>
