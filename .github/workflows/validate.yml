name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# read-only token: the checks only read the repository
permissions:
  contents: read

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin

  build:
    name: Build output is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install esbuild
        run: npm ci --no-audit --no-fund
      - name: Rebuild from src/
        run: npm run build
      - name: Generated files must match src/ (run `npm run build` and commit)
        run: git diff --exit-code -- dist/
      - name: Translations complete
        run: node tests/check-i18n.js
      - name: Blueprints are valid YAML
        run: |
          pip install --quiet pyyaml
          python3 -c "
          import glob, yaml
          class L(yaml.SafeLoader): pass
          L.add_constructor('!input', lambda l, n: l.construct_scalar(n))
          for f in glob.glob('blueprints/**/*.yaml', recursive=True):
              d = yaml.load(open(f), L); assert d['blueprint']['domain'] == 'automation' and d['triggers'] and d['actions'], f; print('ok', f)
          "
      - name: User guide (docs/wiki) links and images
        run: python3 tools/wiki.py check
      - name: Syntax check
        run: |
          node --input-type=module --check < dist/ha-thread-pulse.js
          python3 -c "s=open('dist/thread-pulse.html').read(); open('/tmp/page.js','w').write(s.split('<script>')[-1].split('</script>')[0])"
          node --check /tmp/page.js

  style:
    name: Formatting and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Prettier and ESLint
        run: npm ci --no-audit --no-fund
      - name: Formatting (run `npm run format` to fix)
        run: npm run format:check
      - name: Lint
        run: npm run lint

  browser:
    name: Browser tests (demo mode)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: |
          npm ci --no-audit --no-fund
          pip install -r tests/requirements.txt
      - name: Build from src/
        run: npm run build
      # headless Chrome is preinstalled on the GitHub runners (google-chrome)
      - name: Smoke test – clicks through every feature
        run: python3 tests/smoke_test.py
      - name: Visual test – pixel checks of the map
        # one retry: the very first run on a fresh runner is sometimes slow (#95)
        run: python3 tests/visual_test.py || (echo "retrying once" && python3 tests/visual_test.py)
      - name: Screenshots of the visual test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-screenshots
          path: tests/output/
          retention-days: 7
