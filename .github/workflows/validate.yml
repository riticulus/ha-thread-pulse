name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin

  build:
    name: Build output is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild from src/
        run: python3 build.py
      - name: Generated files must match src/ (run `python3 build.py` and commit)
        run: git diff --exit-code -- dist/
      - name: Translations complete
        run: node tests/check-i18n.js
      - name: User guide (docs/wiki) links and images
        run: python3 tools/wiki.py check
      - name: Syntax check
        run: |
          node --input-type=module --check < dist/ha-thread-pulse.js
          python3 -c "s=open('dist/thread-pulse.html').read(); open('/tmp/page.js','w').write(s.split('<script>')[-1].split('</script>')[0])"
          node --check /tmp/page.js
